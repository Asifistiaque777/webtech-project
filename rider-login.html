<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rider Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
  <div class="auth-card">
    <h1>Rider Login</h1>
    <p class="subtitle">Login to see and deliver orders</p>

    <form id="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="text" id="email" placeholder="rahim@rider.com">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password">
      </div>

      <p class="error" id="error"></p>
      <button type="submit" class="btn">Login</button>
    </form>

    <p class="hint">Demo login: rahim@rider.com / rider123</p>
    <p class="hint">Other riders: karim@rider.com, sumon@rider.com (same password)</p>
    <p class="hint">Are you an admin? <a href="admin-login.html">Admin Login</a></p>
    <p class="hint"><a href="index.html">← Back to Order Page</a></p>
  </div>

  <script src="js/data.js"></script>
  <script src="js/rider-login.js"></script>
</body>
</html>
